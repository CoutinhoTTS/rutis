[package]
name = "rutis-interop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
rutis = { path = "../rutis" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
