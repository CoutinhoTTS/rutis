[package]
name = "rutis-interop"
description = "Mount published Cordis (Node) plugins in rutis applications, with Rust bindings generated from their type declarations"
# Released together with the npm runtime @arcships/rutis-interop, at the same version.
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["cordis", "plugin", "interop", "node"]
categories = ["development-tools::ffi"]

[dependencies]
rutis = { path = "../rutis", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
tempfile = "3"
toml = "0.9"
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
