[package]
name = "rutis-interop"
description = "Plugins of other languages in rutis applications: Cordis (Node) and Python runtimes, and Rust bindings generated for Cordis plugins"
# Released together with the npm runtime @arcships/rutis-interop, at the same version.
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["cordis", "plugin", "interop", "node"]
categories = ["development-tools::ffi"]

[dependencies]
rutis = { path = "../rutis", version = "0.6.0" }
rutis-channel = { path = "../rutis-channel", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"], optional = true }
quote = { version = "1", optional = true }
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }
tempfile = "3"
toml = { version = "0.9", optional = true }
thiserror.workspace = true
tokio.workspace = true

[features]
default = ["node"]
# The Node runtime (Cordis plugins, JavaScript/TypeScript leaf plugins) and
# the build-time binding generator for static mounts.
node = ["dep:syn", "dep:quote", "dep:proc-macro2", "dep:toml"]
# The Python runtime (interop/python): RuntimePlugin::python.
python = []
# Conformance suites other implementations run against themselves.
conformance = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rutis-transport-local = { path = "../rutis-transport-local" }
rutis-bridge = { path = "../rutis-bridge" }
rutis-transport-websocket = { path = "../rutis-transport-websocket" }
rutis-channel = { path = "../rutis-channel", features = ["testing"] }
rutis-transport-memory = { path = "../rutis-transport-memory" }
