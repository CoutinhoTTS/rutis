[package]
name = "rutis-dsh"
description = "Run dsh (its web UI, or its agent loop) in a rutis host, with model calls served by aimux-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
aimux-core = "0.3.0"
aimux-llm = { path = "../aimux-llm" }
futures = "0.3"
rutis = { path = "../rutis" }
rutis-bridge = { path = "../rutis-bridge", features = ["cordis"] }
rutis-loader = { path = "../rutis-loader" }
saphyr-parser = "0.0.12"
semver = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
async-stream = "0.3"
async-trait = "0.1.92"
tempfile = "3"

[build-dependencies]
rutis-bridge = { path = "../rutis-bridge", features = ["cordis"] }

[[bin]]
name = "rutis-dsh"
path = "src/bin/rutis_dsh.rs"

# The npm project with dsh, the launcher and the aimux bundle;
# `npm --prefix crates/rutis-dsh/dsh ci` installs it.
[package.metadata.rutis-cordis]
npm = "dsh"

# The dsh web UI: the launcher starts a dsh profile in the mounted Context.
[package.metadata.rutis-cordis.mounts.web]
path = "dsh/launcher.ts"
provide = ["aimux"]
events = ["rutis-dsh/ready", "rutis-dsh/startup-failed", "rutis-dsh/exit"]

# The dsh agent loop without a UI: the smallest composition that runs an agent
# turn with tools. The probes are test drivers.
[package.metadata.rutis-cordis.mounts.agent]
group = [
    { name = "invariants", plugin = "@deepseek-ai/dsh-invariants" },
    { name = "typert", plugin = "@deepseek-ai/dsh-typert-registry" },
    { name = "llm", plugin = "@deepseek-ai/dsh-llm" },
    { name = "session", plugin = "@deepseek-ai/dsh-session" },
    { name = "projection", plugin = "@deepseek-ai/dsh-session-projection" },
    { name = "system_prompt", plugin = "@deepseek-ai/dsh-system-prompt" },
    { name = "tools", plugin = "@deepseek-ai/dsh-tools" },
    { name = "agents", plugin = "@deepseek-ai/dsh-agent" },
    { name = "agent_loop", plugin = "@deepseek-ai/dsh-agent-loop" },
    { name = "adapter", path = "dsh/aimux/src/adapter.ts" },
    { name = "llm_probe", path = "dsh/probes/llm-probe.ts" },
    { name = "agent_probe", path = "dsh/probes/agent-probe.ts" },
]
provide = ["aimux"]
