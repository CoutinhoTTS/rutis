[package]
name = "rutis-loader"
description = "Data-driven plugin management for rutis: layered desired state, reconcile, editable layer and persistence hook"
edition.workspace = true
version = "0.2.0"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["cordis", "plugin", "loader", "reconcile"]
categories = ["asynchronous", "config"]

[dependencies]
rutis = { path = "../rutis", version = "0.6.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
rutis-interop = { path = "../rutis-interop", version = "0.3.0", optional = true, default-features = false }
url = { version = "2", optional = true }
rutis-bridge = { path = "../rutis-bridge", version = "0.1.0", optional = true }
rutis-channel = { path = "../rutis-channel", version = "0.1.0", optional = true }

[features]
# Plugins of other languages as rows, each language in its own runtime
# process (Unix). Enable the languages the application uses:
# JavaScript/TypeScript (Cordis and leaf plugins) in Node.
node = ["runtimes", "rutis-interop/node", "dep:url"]
# Python leaf plugins (`py:<module>` rows).
python = ["runtimes", "rutis-interop/python"]
# Both languages.
interop = ["node", "python"]
# What every language shares; enabled by the language features.
runtimes = ["dep:rutis-interop"]
# Rows hosted on other nodes (`peer:<id>/<plugin>`), over rutis-bridge links.
peer = ["dep:rutis-bridge", "dep:rutis-channel", "dep:rutis-interop"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = "3"
rutis-transport-memory = { path = "../rutis-transport-memory" }
rutis-transport-local = { path = "../rutis-transport-local", features = ["node", "python"] }
rutis-bridge = { path = "../rutis-bridge" }
rutis-channel = { path = "../rutis-channel" }
rutis-transport-websocket = { path = "../rutis-transport-websocket" }
rutis-interop = { path = "../rutis-interop", default-features = false }
