[package]
name = "rutis-loader"
description = "Data-driven plugin management for rutis: layered desired state, reconcile, editable layer and persistence hook"
edition.workspace = true
version = "0.2.0"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["cordis", "plugin", "loader", "reconcile"]
categories = ["asynchronous", "config"]

[dependencies]
rutis = { path = "../rutis", version = "0.6.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
url = { version = "2", optional = true }
rutis-bridge = { path = "../rutis-bridge", version = "0.2.0", optional = true, default-features = false }

[features]
# Plugins of other languages as rows, each language in its own runtime
# process (Unix). Enable the languages the application uses:
# JavaScript/TypeScript (Cordis and leaf plugins) in Node.
node = ["runtimes", "rutis-bridge/node", "dep:url"]
# Python leaf plugins (`py:<name>` rows).
python = ["runtimes", "rutis-bridge/python"]
# What every language shares; enabled by the language features.
runtimes = ["dep:rutis-bridge"]
# Rows hosted on other nodes (`peer:<id>/<plugin>`), over rutis-bridge links.
peer = ["dep:rutis-bridge"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = "3"
rutis-bridge = { path = "../rutis-bridge", features = ["node", "python", "websocket", "testing"] }
