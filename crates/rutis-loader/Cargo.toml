[package]
name = "rutis-loader"
description = "Data-driven plugin management for rutis: layered desired state, reconcile, editable layer and persistence hook"
edition.workspace = true
version = "0.1.0"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["cordis", "plugin", "loader", "reconcile"]
categories = ["asynchronous", "config"]

[dependencies]
rutis = { path = "../rutis", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
rutis-interop = { path = "../rutis-interop", version = "0.1.0", optional = true }
url = { version = "2", optional = true }

[features]
# InteropResolver: JavaScript (Cordis) plugins as rows, through rutis-interop (Unix).
interop = ["dep:rutis-interop", "dep:url"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = "3"
