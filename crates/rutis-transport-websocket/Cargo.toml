[package]
name = "rutis-transport-websocket"
description = "The WebSocket transport of rutis bridges: TLS, bearer or client-certificate authentication, heartbeats and shared listeners"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["rutis", "transport", "websocket"]
categories = ["network-programming"]

[dependencies]
rutis = { path = "../rutis", version = "0.6.0" }
rutis-channel = { path = "../rutis-channel", version = "0.1.0" }
rutis-bridge = { path = "../rutis-bridge", version = "0.1.0" }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
socket2 = "0.6"
thiserror.workspace = true

[dev-dependencies]
rutis-channel = { path = "../rutis-channel", features = ["testing"] }
rcgen = "0.14"
rutis-interop = { path = "../rutis-interop", default-features = false }
serde_json = "1"
