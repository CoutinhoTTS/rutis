[package]
name = "rutis-transport-memory"
description = "The in-memory transport of rutis bridges: bounded channels within one process, for tests and in-process links"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["rutis", "transport", "testing"]
categories = ["network-programming", "development-tools::testing"]

[dependencies]
rutis = { path = "../rutis", version = "0.6.0" }
rutis-channel = { path = "../rutis-channel", version = "0.1.0" }
rutis-bridge = { path = "../rutis-bridge", version = "0.1.0" }

[dev-dependencies]
rutis-channel = { path = "../rutis-channel", features = ["testing"] }
tokio.workspace = true
rutis-interop = { path = "../rutis-interop", default-features = false }
serde_json = "1"
