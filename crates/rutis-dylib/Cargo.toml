[package]
name = "rutis-dylib"
description = "Optional loader for trusted rutis dylib plugins"
edition.workspace = true
version = "0.1.0"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
test = false
doctest = false

[dependencies]
rutis-sdk = { path = "../rutis-sdk", version = "0.5.0" }
rutis = { path = "../rutis", version = "0.6.0" }
rutis-dylib-meta = { path = "../rutis-dylib-meta", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
sha2 = "0.10"
semver = "1"
thiserror = { workspace = true }
tempfile = "3"
rutis-loader = { path = "../rutis-loader", version = "0.1.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader"] }

[features]
# DylibResolver: dylib plugins as rutis-loader rows (`dylib:<dir>`).
loader = ["dep:rutis-loader"]

[dev-dependencies]
tokio = { workspace = true }

[[example]]
name = "loader_host"
required-features = ["loader"]
