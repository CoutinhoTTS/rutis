[package]
name = "rutis-dylib"
description = "Optional loader for trusted rutis dylib plugins"
edition.workspace = true
version = "0.1.0"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
test = false
doctest = false

[dependencies]
rutis-sdk = { path = "../rutis-sdk", version = "0.4.0" }
rutis = { path = "../rutis", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
sha2 = "0.10"
semver = "1"
libc = "0.2"
thiserror = { workspace = true }
tempfile = "3"
rutis-loader = { path = "../rutis-loader", version = "0.1.0", optional = true }

[features]
# DylibResolver: dylib plugins as rutis-loader rows (`dylib:<dir>`).
loader = ["dep:rutis-loader"]

[dev-dependencies]
tokio = { workspace = true }

[[example]]
name = "loader_host"
required-features = ["loader"]
