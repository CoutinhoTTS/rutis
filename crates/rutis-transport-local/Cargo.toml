[package]
name = "rutis-transport-local"
description = "The local transport of rutis bridges: Unix socket channels to processes on the same machine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["rutis", "transport", "ipc", "unix"]
categories = ["network-programming"]

[dependencies]
rutis = { path = "../rutis", version = "0.6.0" }
rutis-channel = { path = "../rutis-channel", version = "0.1.0" }
rutis-bridge = { path = "../rutis-bridge", version = "0.1.0" }
rutis-interop = { path = "../rutis-interop", version = "0.3.0", default-features = false }
serde_json = "1"
tokio.workspace = true

[features]
# Local runtimes of these languages (LocalRuntime::node, LocalRuntime::python).
node = ["rutis-interop/node"]
python = ["rutis-interop/python"]

[dev-dependencies]
rutis-channel = { path = "../rutis-channel", features = ["testing"] }
tempfile = "3"
