[project]
name = "{{name}}"
version = "0.1.0"
description = "A rutis plugin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["rutis>={{version}},<{{next}}"]
keywords = ["rutis-plugin"]

# A host names this plugin py:{{id}}.
[project.entry-points."rutis.plugins"]
{{id}} = "{{module}}"

[dependency-groups]
dev = ["rutis-host>={{version}},<{{next}}"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{module}}"]
