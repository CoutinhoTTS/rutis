[package]
name = "rutis-bridge"
description = "Connect rutis to other processes, languages and machines: plugins in Node and Python, links between rutis nodes, Cordis plugins mounted with Rust bindings"
# The release train: released together with rutis-loader, rutis-host, and the
# npm and PyPI packages, at the same version.
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["rutis", "plugin", "python", "node", "websocket"]
categories = ["development-tools::ffi", "network-programming"]

[dependencies]
rutis = { path = "../rutis", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
# websocket
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
socket2 = { version = "0.6", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }
# cordis
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }
quote = { version = "1", optional = true }
syn = { version = "2", features = ["full", "visit"], optional = true }
toml = { version = "0.9", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["node"]
# Local Node runtimes (Unix).
node = []
# Local Python runtimes (Unix).
python = []
# The WebSocket transport.
websocket = [
    "dep:futures-util",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:socket2",
    "dep:tokio-rustls",
    "dep:tokio-tungstenite",
]
# Cordis plugins mounted with Rust bindings generated at build time.
cordis = ["node", "dep:proc-macro2", "dep:quote", "dep:syn", "dep:toml"]
# The channel contract tests, and the session, runtime and node conformance
# suites other implementations run.
testing = []

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
tokio = { workspace = true }

[[example]]
name = "smoke"
required-features = ["websocket"]
