[package]
name = "native-mount-example"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
default-run = "native-mount-example"

[dependencies]
rutis = { path = "../../crates/rutis" }
rutis-bridge = { path = "../../crates/rutis-bridge", features = ["cordis"] }
serde_json = "1"
tokio.workspace = true

[build-dependencies]
rutis-bridge = { path = "../../crates/rutis-bridge", features = ["cordis"] }

# The Cordis plugin this example mounts: a TypeScript source fixture.
[package.metadata.rutis-cordis]
npm = "../../node/rutis-runtime"
runtime = "../../node/rutis-runtime"

[package.metadata.rutis-cordis.mounts.bindings]
path = "../../node/rutis-runtime/test/fixtures/counter.ts"

# Edge cases of the generated bindings, mounted by tests/edge.rs.
[package.metadata.rutis-cordis.mounts.edge]
path = "../../node/rutis-runtime/test/fixtures/edge.ts"
provide = ["edgeHost"]
