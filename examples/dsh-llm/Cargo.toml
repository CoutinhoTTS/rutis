[package]
name = "dsh-llm-mount"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "dsh-llm mounted in a rutis application, with model calls served by aimux-llm"

[dependencies]
rutis = { path = "../../crates/rutis" }
rutis-interop = { path = "../../crates/rutis-interop" }
aimux-llm = { path = "../../crates/aimux-llm" }
aimux-core = "0.3.0"
futures = "0.3"
serde_json = "1"
tokio-util.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
async-stream = "0.3"
async-trait = "0.1.92"

[build-dependencies]
rutis-interop = { path = "../../crates/rutis-interop" }

[package.metadata.rutis-interop]
npm = "cordis"

# The smallest dsh composition that runs an agent turn with a tool, its model
# calls served by aimux through the adapter; the rutis application provides
# `aimux`. The probes are test drivers.
[package.metadata.rutis-interop.mounts.dsh]
group = [
    { name = "invariants", plugin = "@deepseek-ai/dsh-invariants" },
    { name = "typert", plugin = "@deepseek-ai/dsh-typert-registry" },
    { name = "llm", plugin = "@deepseek-ai/dsh-llm" },
    { name = "session", plugin = "@deepseek-ai/dsh-session" },
    { name = "projection", plugin = "@deepseek-ai/dsh-session-projection" },
    { name = "system_prompt", plugin = "@deepseek-ai/dsh-system-prompt" },
    { name = "tools", plugin = "@deepseek-ai/dsh-tools" },
    { name = "agents", plugin = "@deepseek-ai/dsh-agent" },
    { name = "agent_loop", path = "cordis/agent-loop.ts" },
    { name = "adapter", path = "cordis/aimux-adapter.ts" },
    { name = "llm_probe", path = "cordis/probe.ts" },
    { name = "agent_probe", path = "cordis/agent-probe.ts" },
]
provide = ["aimux"]
