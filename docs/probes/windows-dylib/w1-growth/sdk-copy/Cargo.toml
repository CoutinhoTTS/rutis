# A copy of rutis-sdk's dependency set (without the identity build script),
# with optional extra dependencies to see how fast the export count grows.
[package]
name = "rutis-sdk-copy"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "rutis_sdk"
crate-type = ["dylib"]

[features]
serde = ["dep:serde"]
misc = ["dep:regex", "dep:tracing", "dep:tracing-subscriber", "dep:chrono", "dep:uuid"]
web = ["dep:reqwest"]

[dependencies]
rutis = { path = "../../../../../crates/rutis" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"], optional = true }
regex = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"], optional = true }
