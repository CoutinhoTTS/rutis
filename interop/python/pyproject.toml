[project]
name = "rutis-runtime"
version = "0.3.0"
description = "Python runtime and plugin SDK of rutis-interop: Python plugins for rutis applications"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# WebSocket channels (listen:ws://…, listen:wss://…).
network = ["websockets>=13"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rutis_runtime"]
