[workspace]
resolver = "2"
members = ["crates/rutis", "crates/rutis-agent", "crates/rutis-cli", "crates/rutis-dsh", "crates/aimux-llm", "crates/rutis-sdk", "crates/rutis-dylib", "crates/rutis-dylib-launcher", "crates/rutis-xtask", "crates/rutis-interop", "crates/rutis-loader", "crates/rutis-dev", "examples/native-mount", "examples/dsh-baseline", "examples/interop-experiments", "tests/dylib-fixtures/greeter-v1", "tests/dylib-fixtures/greeter-v2"]

[workspace.package]
edition = "2021"
version = "0.6.0"
license = "MIT"
repository = "https://github.com/arcships/rutis"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
