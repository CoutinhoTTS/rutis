# The network stack releases with tags bridge-vX.Y.Z (the rutis-bridge
# version): rutis-bridge, its transports and the local runtime composition,
# in dependency order. Each crate is published when crates.io does not have
# its version yet, so a release that changes only some of them republishes
# nothing else. It builds on rutis-interop and rutis-channel, which release
# with interop-vX.Y.Z first; rutis-loader (loader-vX.Y.Z) comes after.
name: publish rutis-bridge

on:
  push:
    tags: ["bridge-v*"]

permissions:
  contents: read

concurrency:
  group: publish-bridge-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # In dependency order.
  CRATES: >-
    rutis-bridge
    rutis-transport-memory
    rutis-transport-local
    rutis-transport-websocket
    rutis-runtime-local

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1

      - name: Verify the tag
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rutis-bridge") | .version')
          test "$GITHUB_REF_NAME" = "bridge-v$version"

      # What these crates build on must already be on crates.io.
      - name: Check the published dependencies
        run: |
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          for crate in rutis rutis-channel rutis-interop; do
            version=$(echo "$metadata" | jq -r ".packages[] | select(.name == \"$crate\") | .version")
            curl -sf -A "rutis release (github.com/arcships/rutis)" "https://crates.io/api/v1/crates/$crate/$version" >/dev/null \
              || { echo "::error::$crate $version is not on crates.io: release it first"; exit 1; }
          done

      - name: Test
        run: cargo test --locked -p rutis-bridge --features conformance -p rutis-transport-memory -p rutis-transport-local -p rutis-transport-websocket -p rutis-runtime-local

      # Every crate is packaged and built against the others before any is
      # published: unpublished ones stand in for crates.io.
      - name: Package
        run: |
          args=$(for crate in $CRATES; do printf -- '-p %s ' "$crate"; done)
          cargo package --locked $args

      - name: Publish what crates.io does not have
        run: |
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          for crate in $CRATES; do
            version=$(echo "$metadata" | jq -r ".packages[] | select(.name == \"$crate\") | .version")
            if curl -sf -A "rutis release (github.com/arcships/rutis)" "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
              echo "$crate $version is already published"
            else
              cargo publish --locked -p "$crate"
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
