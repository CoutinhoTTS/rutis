# 常规 CI:push / PR 自动跑全量测试 + 编译检查。
# 防回归:任何改动(agent/cli/内核/桥)引入的失败在此显式变红。
#
# rutis-agent 的 rutui 依赖已从 crates.io 解析,无需额外 checkout。
#
# node e2e(rutis-cordis host_cordis)需要外部 checkout(DSH_ROOT /
# MIN_CORDIS_ROOT),CI 环境没有,经 RUTIS_SKIP_NODE_E2E=1 跳过。

name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # rutui 已发布 crates.io(rutis-agent 走 version 依赖,与其他外部
      # 依赖同构);hack 本地 rutui 时按惯例在工作区根加未提交的 [patch]。

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            interop/node/package-lock.json
            interop/baseline/package-lock.json
            examples/dsh-llm/cordis/package-lock.json
      - run: npm --prefix interop/node ci
      - run: npm --prefix interop/node test
      # Real published Cordis plugins for the rutis-interop baseline test.
      - run: npm --prefix interop/baseline ci
      # dsh-llm served by aimux-llm (examples/dsh-llm).
      - run: npm --prefix examples/dsh-llm/cordis ci

      - name: cargo test (workspace, skip external host e2e)
        run: cargo test --workspace
        env:
          RUTIS_SKIP_NODE_E2E: "1"

      - name: cargo check (all targets)
        run: cargo check --workspace --all-targets

  # rutis 相对 crates.io 最新版的公开 API 变化：列出破坏性变更，提示发布时
  # 需要提升的版本；不阻止合并（0.x 允许在 minor 版本中破坏）。真正的拦截在
  # publish-rutis.yml：版本号不允许的破坏性变更会使发布失败。
  semver-rutis:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: rutis

  dylib-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: dylib host child environment
        run: cargo test -p rutis-cli --features dylib-plugins --bin rutis-cli
      - name: plugin swap and pre-dlopen rejection
        run: bash tools/test-dylib.sh
      - name: launcher pre-execution verification
        run: bash tools/test-dylib-launcher.sh
      - name: reproducible SDK across source and target paths
        run: bash tools/test-dylib-repro.sh

  static-platforms:
    strategy:
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        if: runner.os != 'Windows'
        with:
          node-version: '26'
      - run: npm --prefix interop/node ci
        if: runner.os != 'Windows'
      - name: keep workspace static builds available
        run: cargo check --workspace --all-targets

  sdk-repro:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        slot: [a, b]
    steps:
      - uses: actions/checkout@v4
        with:
          path: source-${{ matrix.slot }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: build SDK at independent paths
        working-directory: source-${{ matrix.slot }}
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-${{ matrix.slot }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-${{ matrix.slot }}
        run: |
          mkdir -p "$CARGO_HOME"
          export RUSTFLAGS="--remap-path-prefix=$PWD=/src --remap-path-prefix=$CARGO_HOME=/cargo --remap-path-prefix=$CARGO_TARGET_DIR=/target -C link-arg=-Wl,-rpath,\$ORIGIN"
          export RUTIS_SDK_LOCKFILE="$PWD/Cargo.lock"
          cargo build --release --locked -p rutis-sdk
          sha256sum "$CARGO_TARGET_DIR/release/librutis_sdk.so" | cut -d ' ' -f 1 > "$RUNNER_TEMP/sdk.sha"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-hash-${{ matrix.slot }}
          path: ${{ runner.temp }}/sdk.sha

  sdk-repro-compare:
    runs-on: ubuntu-24.04
    needs: sdk-repro
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-hash-*
          path: hashes
      - run: cmp hashes/sdk-hash-a/sdk.sha hashes/sdk-hash-b/sdk.sha
