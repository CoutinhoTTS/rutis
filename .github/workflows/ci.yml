# 常规 CI:push / PR 自动跑全量测试 + 编译检查。
# 防回归:任何改动(agent/cli/内核/interop/rutis-dsh)引入的失败在此显式变红。
#
# rutis-agent 的 rutui 依赖已从 crates.io 解析,无需额外 checkout。

name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # rutui 已发布 crates.io(rutis-agent 走 version 依赖,与其他外部
      # 依赖同构);hack 本地 rutui 时按惯例在工作区根加未提交的 [patch]。

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            interop/node/package-lock.json
            interop/baseline/package-lock.json
            crates/rutis-dsh/dsh/package-lock.json
      - run: npm --prefix interop/node ci
      - run: npm --prefix interop/node test
      # Real published Cordis plugins for the rutis-interop baseline test.
      - run: npm --prefix interop/baseline ci
      # dsh (web UI and agent loop) served by aimux in the rutis-dsh host.
      - run: npm --prefix crates/rutis-dsh/dsh ci
      - run: npm --prefix crates/rutis-dsh/dsh test

      - name: cargo test (workspace)
        run: cargo test --workspace

      # JavaScript plugins as rutis-loader rows (needs the interop runtime).
      - name: cargo test (rutis-loader interop rows)
        run: cargo test -p rutis-loader --features interop

      - name: cargo check (all targets)
        run: cargo check --workspace --all-targets

  # rutis 相对 crates.io 最新版的公开 API 变化：发现破坏性变更时给出警告，
  # 并在 job 摘要中列出，提示发布时需要提升的版本；不使 CI 失败（0.x 允许在
  # minor 版本中破坏）。真正的拦截在 publish-rutis.yml：版本号不允许的破坏性
  # 变更会使发布失败。
  semver-rutis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-semver-checks
      - name: Report API changes since the latest rutis release
        run: |
          if cargo semver-checks -p rutis > semver.txt 2>&1; then
            echo "No breaking change since the latest rutis release." >> "$GITHUB_STEP_SUMMARY"
          elif ! grep -q 'semver requires new' semver.txt; then
            # The tool itself failed (e.g. the baseline could not be built).
            cat semver.txt
            exit 1
          else
            echo "::warning title=rutis semver::Breaking API changes since the latest crates.io release; the next rutis release must bump the minor version (0.x). See the job summary."
            { echo '### Breaking changes since the latest rutis release'; echo; echo '```'; sed 's/\x1b\[[0-9;]*m//g' semver.txt | grep -vE '^\s+(Building|Built|Parsing|Parsed|Checking|Checked|Compiling|Downloaded|Updating)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  dylib-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: dylib host child environment
        run: cargo test -p rutis-cli --features dylib-plugins --bin rutis-cli
      - name: plugin swap and pre-dlopen rejection
        run: bash tools/test-dylib.sh
      - name: launcher pre-execution verification
        run: bash tools/test-dylib-launcher.sh
      - name: reproducible SDK across source and target paths
        run: bash tools/test-dylib-repro.sh

  dylib-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: plugin file checks
        run: cargo test -p rutis-dylib-meta
      - name: dylib host child environment
        run: cargo test -p rutis-cli --features dylib-plugins --bin rutis-cli
      - name: plugin swap, pre-dlopen rejection, quarantine and hardened host
        run: bash tools/test-dylib.sh
      - name: launcher pre-execution verification
        run: bash tools/test-dylib-launcher.sh
      - name: reproducible SDK across source and target paths
        run: bash tools/test-dylib-repro.sh

  static-platforms:
    strategy:
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        if: runner.os != 'Windows'
        with:
          node-version: '26'
      - run: npm --prefix interop/node ci
        if: runner.os != 'Windows'
      - name: keep workspace static builds available
        run: cargo check --workspace --all-targets

  sdk-repro:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        slot: [a, b]
    steps:
      - uses: actions/checkout@v4
        with:
          path: source-${{ matrix.slot }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: build SDK at independent paths
        working-directory: source-${{ matrix.slot }}
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-${{ matrix.slot }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-${{ matrix.slot }}
        run: |
          mkdir -p "$CARGO_HOME"
          export RUSTFLAGS="--remap-path-prefix=$PWD=/src --remap-path-prefix=$CARGO_HOME=/cargo --remap-path-prefix=$CARGO_TARGET_DIR=/target"
          export RUTIS_SDK_LOCKFILE="$PWD/Cargo.lock"
          # Build the SDK through the host anchor, as tools/build-dylib-bundle.sh does.
          export RUTIS_SDK_ARTIFACT_SHA256="$(printf '0%.0s' {1..64})"
          cargo build --release --locked -p rutis-cli --features dylib-plugins
          sdk_file="$CARGO_TARGET_DIR/release/librutis_sdk.so"
          if ! readelf -d "$sdk_file" | grep -Eq 'NEEDED.*\[libstd-[^]]*\.so\]'; then
            readelf -d "$sdk_file"
            echo "SDK does not depend on the dynamic libstd" >&2
            exit 1
          fi
          sha256sum "$sdk_file" | cut -d ' ' -f 1 > "$RUNNER_TEMP/sdk.sha"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-hash-${{ matrix.slot }}
          path: ${{ runner.temp }}/sdk.sha

  # Same as sdk-repro, on two separate macOS runners.
  sdk-repro-macos:
    runs-on: macos-15
    strategy:
      matrix:
        slot: [a, b]
    steps:
      - uses: actions/checkout@v4
        with:
          path: source-${{ matrix.slot }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: build SDK at independent paths
        working-directory: source-${{ matrix.slot }}
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-${{ matrix.slot }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-${{ matrix.slot }}
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          mkdir -p "$CARGO_HOME"
          xcodebuild -version
          export RUSTFLAGS="--remap-path-prefix=$PWD=/src --remap-path-prefix=$CARGO_HOME=/cargo --remap-path-prefix=$CARGO_TARGET_DIR=/target"
          export RUTIS_SDK_LOCKFILE="$PWD/Cargo.lock"
          export RUTIS_SDK_ARTIFACT_SHA256="$(printf '0%.0s' {1..64})"
          cargo build --release --locked -p rutis-cli --features dylib-plugins
          sdk_file="$CARGO_TARGET_DIR/release/librutis_sdk.dylib"
          if ! otool -L "$sdk_file" | grep -Eq '@rpath/libstd-[^ ]*\.dylib'; then
            otool -L "$sdk_file"
            echo "SDK does not depend on the dynamic libstd" >&2
            exit 1
          fi
          shasum -a 256 "$sdk_file" | cut -d ' ' -f 1 > "$RUNNER_TEMP/sdk.sha"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-hash-macos-${{ matrix.slot }}
          path: ${{ runner.temp }}/sdk.sha

  sdk-repro-macos-compare:
    runs-on: ubuntu-24.04
    needs: sdk-repro-macos
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-hash-macos-*
          path: hashes
      - run: cmp hashes/sdk-hash-macos-a/sdk.sha hashes/sdk-hash-macos-b/sdk.sha

  sdk-repro-compare:
    runs-on: ubuntu-24.04
    needs: sdk-repro
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-hash-[ab]
          path: hashes
      - run: cmp hashes/sdk-hash-a/sdk.sha hashes/sdk-hash-b/sdk.sha
