# rutis-loader releases with tags loader-vX.Y.Z. It depends on rutis and,
# for its optional features, on rutis-interop and rutis-channel (`interop`,
# `peer`) and rutis-bridge (`peer`): crates.io needs optional dependencies
# published too, so release those first (tags rutis-vX.Y.Z, interop-vX.Y.Z,
# bridge-vX.Y.Z) when this version needs new ones.
name: publish rutis-loader

on:
  push:
    tags: ["loader-v*"]

permissions:
  contents: read

concurrency:
  group: publish-loader-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1

      - name: Verify tag matches crate version
        run: |
          package_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rutis-loader") | .version')
          test "$GITHUB_REF_NAME" = "loader-v$package_version"

      - name: Check the published dependencies
        run: |
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          for crate in rutis rutis-channel rutis-interop rutis-bridge; do
            version=$(echo "$metadata" | jq -r ".packages[] | select(.name == \"$crate\") | .version")
            curl -sf -A "rutis release (github.com/arcships/rutis)" "https://crates.io/api/v1/crates/$crate/$version" >/dev/null \
              || { echo "::error::$crate $version is not on crates.io: release it first"; exit 1; }
          done

      # The dry run resolves every dependency, the optional rutis-interop
      # included, from crates.io and builds against the released rutis: it
      # fails while a needed release of either is missing.
      - name: Dry run
        run: cargo publish --locked -p rutis-loader --dry-run

      - name: Publish rutis-loader to crates.io
        run: cargo publish --locked -p rutis-loader
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
