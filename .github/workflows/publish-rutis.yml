# Core crate tags use rutis-vX.Y.Z; CLI binary releases use vX.Y.Z.
name: publish rutis crate

on:
  push:
    tags: ["rutis-v*"]

permissions:
  contents: read

concurrency:
  group: publish-rutis-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches crate version
        run: |
          package_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rutis") | .version')
          test "$GITHUB_REF_NAME" = "rutis-v$package_version"

      # A release whose version does not allow its API changes (a breaking
      # change in a patch release) fails here, before publishing.
      - name: Check semver against the latest crates.io release
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: rutis

      - name: Publish rutis to crates.io
        run: cargo publish --locked -p rutis
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
