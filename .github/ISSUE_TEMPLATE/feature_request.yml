name: Feature request · 功能建议
description: Suggest an improvement or a new capability. · 建议改进或新能力。
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem · 要解决的问题
      description: What are you trying to do, and what gets in the way today? · 你想做什么，现在遇到了什么阻碍？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal · 设想
      description: How you imagine it could work. Sketches of the API are welcome. · 你设想它怎样工作，欢迎画出 API 的样子。
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives · 其他做法
      description: Workarounds you use now, or other designs you considered. · 现在的变通办法，或考虑过的其他设计。
